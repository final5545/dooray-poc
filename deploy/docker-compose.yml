# Dooray 슬래시 커맨드 서버 — Docker Swarm 배포
#
# ai-node Traefik 설정에서 읽은 제약을 반영했다:
#   --providers.swarm=true
#   --providers.swarm.exposedbydefault=false   → 라벨을 명시해야 노출된다
#   --providers.docker.network=redis           → 이 네트워크에 붙어야 Traefik이 인식한다
#   --entrypoints.websecure.address=:443
#   --certificatesresolvers.leresolver...      → Let's Encrypt 자동 발급
#
# 배포:
#   docker stack deploy -c docker-compose.yml dooray
#
# 확인:
#   curl https://dooray.infomaxai.com/health

version: "3.8"

services:
  command:
    image: dooray-command:latest
    environment:
      # Dooray 개인 액세스 토큰 (업무 상태 변경용)
      DOORAY_TOKEN: "${DOORAY_TOKEN}"
      DOORAY_SUPPORT_PROJECT: "${DOORAY_SUPPORT_PROJECT}"
      DOORAY_DOMAIN: "infomax.dooray.com"
      # 연동 서비스에서 발급한 앱 토큰. 요청 검증에 쓴다.
      DOORAY_APP_TOKEN: "${DOORAY_APP_TOKEN}"
      # 접수 알림을 띄울 기술 지원 대화방
      DOORAY_SUPPORT_CHANNEL: "${DOORAY_SUPPORT_CHANNEL}"
      # 고객사명 조회. 실 CRM이 열리면 이 한 줄만 바꾼다.
      CRM_BASE_URL: "http://mockcrm:8900"
    networks:
      - redis
    deploy:
      replicas: 1
      # 이미지를 로컬에서 빌드하므로 그 노드에 고정한다.
      # 레지스트리에 올리면 이 제약은 빼도 된다.
      placement:
        constraints:
          - node.hostname == ai-node-1
      restart_policy:
        condition: any
        delay: 5s
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=redis"
        - "traefik.http.routers.dooraycmd.rule=Host(`dooray.infomaxai.com`)"
        - "traefik.http.routers.dooraycmd.entrypoints=websecure"
        - "traefik.http.routers.dooraycmd.tls=true"
        - "traefik.http.routers.dooraycmd.tls.certresolver=leresolver"
        - "traefik.http.services.dooraycmd.loadbalancer.server.port=8910"

  # 모의 CRM — 실 CRM이 열리기 전까지 고객사명을 준다.
  # 에이전트(맥)와 같은 파일을 쓰므로 두 곳의 데이터가 어긋나지 않는다.
  mockcrm:
    image: dooray-command:latest
    command: ["python", "-u", "standalone/mock_crm.py", "8900"]
    environment:
      MOCK_CRM_HOST: "0.0.0.0"
    networks:
      - redis
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ai-node-1
      restart_policy:
        condition: any
        delay: 5s

networks:
  redis:
    external: true
